openapi: 3.0.3
info:
  title: supabackup API
  version: 0.1.0
  description: |
    supabackup control-plane API (Phase 1 scope: health, bootstrap, auth).

    Contract-first: this file is the single source of truth. Server types are
    generated with oapi-codegen (strict server), frontend types with
    openapi-typescript. CI fails if committed generated files drift from this
    contract. Generated types do NOT replace server-side runtime validation.
servers:
  - url: /api
    description: All routes are served under the /api base path by the server.
security:
  - cookieAuth: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness (process alive). Anonymous and information-free.
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ready:
    get:
      operationId: getReady
      summary: "Readiness (local state: DB reachable, schema migrated). Anonymous, no sensitive data."
      security: []
      responses:
        "200":
          description: Ready to serve.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Not ready (starting up, migration pending, or DB error).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health/details:
    get:
      operationId: getHealthDetails
      summary: Detailed runtime diagnostics. Requires authentication.
      responses:
        "503":
          description: Session storage temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: Runtime details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthDetails"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/bootstrap:
    post:
      operationId: postAuthBootstrap
      summary: Create the initial admin using a one-time token from the local CLI.
      description: |
        Fails with 403 if the token is unknown, used or expired; 409 if any
        admin user already exists. This endpoint can never be used by a
        public first visitor without the locally printed token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapRequest"
      responses:
        "201":
          description: Admin created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Invalid, used or expired bootstrap token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already initialized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /auth/login:
    post:
      operationId: postAuthLogin
      summary: Log in with username and password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in; session and CSRF cookies are set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          description: Origin header present but not same-origin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Bad credentials (indistinguishable unknown-user vs wrong-password).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          description: Rate limited (too many attempts or consecutive failures).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Overloaded"
  /auth/logout:
    post:
      operationId: postAuthLogout
      summary: Revoke the current session.
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
          description: Session-bound CSRF token (double-submit via the sb_csrf cookie).
      responses:
        "204":
          description: Logged out.
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: CSRF token missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          description: Session storage temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /age/status:
    get:
      operationId: getAgeStatus
      summary: age encryption configuration (protocol B). Recipient is public.
      responses:
        "200":
          description: Recipient configured or not.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgeStatus"
        "500":
          $ref: "#/components/responses/Internal"
  /age/recipient:
    put:
      operationId: putAgeRecipient
      summary: Set the age recipient (public key) used to encrypt backups.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgeRecipientRequest"
      responses:
        "200":
          description: Recipient stored with its fingerprint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgeStatus"
        "400":
          description: Invalid recipient.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
  /databases:
    get:
      operationId: listDatabases
      summary: Registered backup targets (no secrets).
      responses:
        "200":
          description: All databases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseList"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: createDatabase
      summary: Register a database after a live connection test.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabaseCreate"
      responses:
        "201":
          description: Created; the connection was tested live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Database"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A database with this name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Connection test failed (error class in body).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
  /databases/{id}:
    get:
      operationId: getDatabase
      summary: One database with its latest job summary.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Database"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      operationId: deleteDatabase
      summary: Remove the registration. Committed artifacts are kept.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204":
          description: Removed.
        "409":
          description: A job is pending or running for this database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
  /databases/{id}/backups:
    post:
      operationId: triggerBackup
      summary: Enqueue a backup job for this database (returns immediately).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "202":
          description: Job queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A job is already pending or running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
  /tasks:
    get:
      operationId: listTasks
      summary: Recent jobs across all databases (newest first).
      responses:
        "200":
          description: Job list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "500":
          $ref: "#/components/responses/Internal"
  /tasks/{id}:
    get:
      operationId: getTask
      summary: One job with artifact and manifest details.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Unknown id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
  /tasks/{id}/cancel:
    post:
      operationId: cancelTask
      summary: Request cancellation of a pending or running job.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "202":
          description: Cancellation requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "409":
          description: Job is not pending or running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
  /auth/me:
    get:
      operationId: getAuthMe
      summary: Current authenticated user.
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          description: Session storage temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  responses:
    PayloadTooLarge:
      description: Request body exceeds the allowed size.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: Content-Type must be application/json.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Rate limited; retry later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: Unexpected internal error (nothing persisted, no state change reported as success).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Overloaded:
      description: Temporary overload (e.g. password-hashing budget exhausted); retry later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sb_session
      description: >-
        Server-side session. The cookie name is `sb_session` in plain-HTTP dev
        mode and `__Host-sb_session` when Secure cookies are enabled (production).
        State-changing requests additionally require the `X-CSRF-Token` header
        echoing the session-bound CSRF cookie.
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    HealthDetails:
      type: object
      required: [version, commit, goVersion, uptimeSeconds]
      properties:
        version:
          type: string
        commit:
          type: string
        goVersion:
          type: string
        uptimeSeconds:
          type: integer
          format: int64
        sqliteOpenConns:
          type: integer
    User:
      type: object
      required: [id, username, createdAt]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        createdAt:
          type: integer
          format: int64
          description: Unix seconds.
    BootstrapRequest:
      type: object
      required: [token, username, password]
      properties:
        token:
          type: string
          maxLength: 128
          description: One-time token printed by `supabackup bootstrap`.
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: "^[A-Za-z0-9._-]+$"
        password:
          type: string
          minLength: 12
          maxLength: 128
          format: password
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 12
          maxLength: 128
          format: password
    AgeStatus:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
        recipient:
          type: string
          description: Public age recipient (empty when not configured).
        keyId:
          type: string
          description: Recipient fingerprint (protocol B).
    AgeRecipientRequest:
      type: object
      required: [recipient]
      properties:
        recipient:
          type: string
          minLength: 20
          maxLength: 200
          description: age recipient string (age1…).
    Database:
      type: object
      required: [id, name, platform, envTag, serverVersion, sslMode, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        platform:
          type: string
          enum: [supabase, neon, railway, generic]
        envTag:
          type: string
        serverVersion:
          type: string
        sslMode:
          type: string
          description: Persisted TLS mode for this target (round-1 review P1-09 —持续可见).
        lastTask:
          $ref: "#/components/schemas/Task"
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64
    DatabaseList:
      type: object
      required: [databases]
      properties:
        databases:
          type: array
          items:
            $ref: "#/components/schemas/Database"
    DatabaseCreate:
      type: object
      required: [name, connectionUri]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        platform:
          type: string
          enum: [supabase, neon, railway, generic]
          default: generic
        envTag:
          type: string
          maxLength: 64
        connectionUri:
          type: string
          minLength: 20
          maxLength: 500
          format: password
          description: postgres:// URI; stored AES-GCM-encrypted, never returned.
    Task:
      type: object
      required: [id, databaseId, status, attempt]
      properties:
        id:
          type: integer
          format: int64
        databaseId:
          type: integer
          format: int64
        status:
          type: string
          enum: [pending, running, succeeded, failed, canceled, interrupted]
        attempt:
          type: integer
        errorClass:
          type: string
          enum: ["", network, auth, permission, client_version, disk, storage_upload, verification, unknown]
        errorMessage:
          type: string
        artifactSha256:
          type: string
        artifactSize:
          type: integer
          format: int64
        hasManifest:
          type: boolean
        cancelRequested:
          type: boolean
        scheduledAt:
          type: integer
          format: int64
        startedAt:
          type: integer
          format: int64
          nullable: true
        finishedAt:
          type: integer
          format: int64
          nullable: true
    TaskList:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error class.
        message:
          type: string
          description: Human-readable, credential-free.
