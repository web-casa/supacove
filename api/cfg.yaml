# oapi-codegen configuration: strict server + models from api/openapi.yaml.
# Regenerate: make api-gen ; CI regenerates and fails on drift.
package: api
# Output path is relative to the directory make api-gen runs from (repo root).
output: backend/internal/api/api.gen.go
generate:
  models: true
  chi-server: true
  strict-server: true
