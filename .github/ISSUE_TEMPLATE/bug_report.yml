name: Bug report
description: Something failed, lied about success, or leaked — tell us exactly what happened
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: supabackup version
      description: Output of `supabackup version` or the image tag / commit
    validations: { required: true }
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen
      options: [backup job, restore/verification, notifications, console UI, metrics, install/upgrade, other]
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What did you expect
    validations: { required: true }
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Include the task status/error class and the redacted log lines around the job timestamp
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Platform (Supabase/Neon/Railway/self-hosted), destination type, schedule/heartbeat config if relevant
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: No credentials, tokens or ciphertext are included in this report
          required: true
