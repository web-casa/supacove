name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l backend | grep -v api.gen.go)" || { gofmt -l backend; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test (race)
        run: go test -race ./backend/...
      - name: build (backend, placeholder dist)
        run: CGO_ENABLED=0 go build ./backend/...

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install oapi-codegen
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.5.0
      - name: Regenerate server types
        run: $(go env GOPATH)/bin/oapi-codegen -config api/cfg.yaml api/openapi.yaml
      - name: Fail on drift
        run: git diff --exit-code -- backend/internal/api || { echo "::error::api.gen.go drifted from api/openapi.yaml"; exit 1; }

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-fund --no-audit
      - name: Regenerate API types
        working-directory: frontend
        run: npm run gen:api
      - name: Fail on drift
        run: git diff --exit-code -- frontend/src/api/schema.d.ts || { echo "::error::schema.d.ts drifted from api/openapi.yaml"; exit 1; }
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: [backend, contract, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          tags: supabackup:ci
      - name: Smoke: non-root, healthz, takeover blocked, healthcheck
        run: |
          docker run -d --name sb-ci -p 18080:8080 supabackup:ci
          sleep 3
          test "$(docker exec sb-ci id -u)" = "10001"
          curl -fsS http://127.0.0.1:18080/api/healthz | grep -q '"status":"ok"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/api/auth/bootstrap -H 'Content-Type: application/json' -d '{"token":"x","username":"nope","password":"nope-pass-123"}')
          test "$code" -ge 400
          docker exec sb-ci /app/supabackup bootstrap | grep -q "One-time bootstrap token"
          docker rm -f sb-ci >/dev/null
