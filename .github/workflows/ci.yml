name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  merge_group:

# Least privilege: every job is read-only, except the tag-only distribution
# jobs — `release` (job-scoped contents:write, draft GitHub release with the
# binaries) and the GHCR publish jobs (job-scoped packages:write).
permissions:
  contents: read

# Runners are pinned to ubuntu-24.04: the `ubuntu-latest` label flips to
# Ubuntu 26 on 2026-10-19 (actions/runner-images#14748), and PGDG/apt
# availability plus toolchain behavior on the new distro are unvalidated.
# Move to 26 deliberately after a validation run, not by riding the label.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned tool versions: scan results must be reproducible per commit.
  # Third-party ACTIONS are pinned by commit SHA (immutable); versions below
  # are Go/CLI tools installed at run time.
  # Go patch-day note: a brand-new patch can reach the module proxy hours
  # before actions/go-versions carries it; if go-version-file fails to
  # download, bridge temporarily with `go-version: "1.26"` + GOTOOLCHAIN=auto
  # (setup-go v7 sets GOTOOLCHAIN=local and cannot bridge — stay on the
  # exact-file pin there).
  GOLANGCI_VERSION: v2.14.0
  OAPI_CODEGEN_VERSION: v2.5.0
  OASDIFF_VERSION: v1.11.5
  GOVULNCHECK_VERSION: v1.8.0
  GITLEAKS_VERSION: v8.30.1
  TRIVY_VERSION: 0.66.0
  ACTIONLINT_VERSION: v1.7.7

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          cache: true
      # The M1 kernel-chain tests restore real PG18 containers: FindClient
      # needs a pg_dump with major >= 18 (runner stock tops out below that).
      # Same PGDG source as the release Dockerfile.
      - name: Install PostgreSQL 18 client (PGDG)
        run: |
          # Same PGDG wiring as the release Dockerfile (runner stock client
          # tops out below 18).
          sudo install -d /usr/share/postgres-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgres-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgres-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          pg_dump --version
          test -x /usr/lib/postgresql/18/bin/pg_dump
      - name: gofmt
        run: test -z "$(gofmt -l backend | grep -v api.gen.go)" || { gofmt -l backend; exit 1; }
      - name: golangci-lint (pinned)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: "${{ env.GOLANGCI_VERSION }}"
          args: --timeout=5m
      - name: vet
        run: go vet ./...
      - name: test (race; the detector needs CGO on Linux)
        run: CGO_ENABLED=1 go test -race -shuffle=on -count=1 -timeout=15m ./backend/...
      - name: test + build under production conditions (CGO off)
        run: |
          CGO_ENABLED=0 go test -count=1 -timeout=15m ./backend/...
          CGO_ENABLED=0 go build -trimpath ./backend/...

  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The baseline guard diffs against the PR base SHA: a shallow
          # clone would make that diff error INSIDE an if-condition and
          # silently pass (review R6-02).
          fetch-depth: 0
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install oapi-codegen
        run: "go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@\"${OAPI_CODEGEN_VERSION}\""
      - name: Regenerate server types
        run: "\"$(go env GOPATH)/bin/oapi-codegen\" -config api/cfg.yaml api/openapi.yaml"
      - name: Fail on drift
        run: git diff --exit-code -- backend/internal/api || { echo "::error::api.gen.go drifted from api/openapi.yaml"; exit 1; }
      - name: Install oasdiff
        run: "go install github.com/oasdiff/oasdiff@\"${OASDIFF_VERSION}\""
      - name: No breaking contract changes vs baseline
        run: "\"$(go env GOPATH)/bin/oasdiff\" breaking --fail-on ERR api/openapi-baseline.yaml api/openapi.yaml"
      - name: Baseline changes require a release tag
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # Release tags are the sanctioned baseline-refresh path.
          [ "$IS_TAG" = "true" ] && exit 0
          # A brand-new branch (first push of main, or any new ref) reports
          # the all-zero before-SHA: there is no previous state to protect,
          # so there is nothing to compare against.
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "new branch: no base commit, baseline guard not applicable"
            exit 0
          fi
          # Fail CLOSED: an unusable base (missing object) is a guard
          # failure, not a pass; --no-renames closes the rename bypass.
          git cat-file -e "$BASE_SHA^{commit}"
          changed="$(git diff --name-only --no-renames "$BASE_SHA" HEAD)"
          if printf '%s\n' "$changed" | grep -q '^api/openapi-baseline.yaml$'; then
            echo "::error::api/openapi-baseline.yaml moved outside a release tag; breaking-change protection would be void"
            exit 1
          fi

  security:
    name: Security audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0  # gitleaks needs history for PR commit ranges
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
      - name: govulncheck (pinned)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@"${GOVULNCHECK_VERSION}"
          # x/vuln older than v1.8 declares go <1.26 and refuses the module
          "$(go env GOPATH)/bin/govulncheck" ./backend/...
      # gitleaks-action v2 requires a paid license for organization repos;
      # the CLI itself is free and is exactly what local pre-release scans
      # use (docs/release-scan-evidence.md). Full history, redacted output.
      - name: gitleaks (pinned CLI, full history)
        run: |
          # go.mod still declares the pre-rename path; the GitHub org redirect
          # only applies to git fetches, not module resolution.
          go install github.com/zricethezav/gitleaks/v8@"${GITLEAKS_VERSION}"
          "$(go env GOPATH)/bin/gitleaks" detect \
            --source . --log-opts="--all" --redact --exit-code 1
      - name: workflow lint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@"${ACTIONLINT_VERSION}"
          "$(go env GOPATH)/bin/actionlint"
      - name: frontend dependency audit
        working-directory: frontend
        run: npm ci --no-fund && npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-fund --no-audit
      - name: Regenerate API types
        working-directory: frontend
        run: npm run gen:api
      - name: Fail on drift
        run: git diff --exit-code -- frontend/src/api/schema.d.ts || { echo "::error::schema.d.ts drifted from api/openapi.yaml"; exit 1; }
      - name: eslint
        working-directory: frontend
        run: npm run lint
      - name: stylelint
        working-directory: frontend
        run: npm run stylelint
      - name: unit/component tests
        working-directory: frontend
        run: npx vitest run
      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    needs: [backend, contract, frontend]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install frontend dependencies (locked versions first)
        working-directory: frontend
        run: npm ci
      - name: install playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: e2e against the embedded binary
        run: make e2e

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0  # docs pages take their "last updated" date from git history
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: install
        working-directory: docs-site
        run: npm ci
      - name: locale parity
        working-directory: docs-site
        run: node scripts/check-parity.mjs
      - name: build (static export)
        working-directory: docs-site
        run: npx next build
      - name: "smoke (Pages simulator: status codes, _redirects, _headers, 404, search index)"
        working-directory: docs-site
        run: node scripts/smoke.mjs

  image:
    runs-on: ubuntu-24.04
    needs: [backend, contract, frontend, security, e2e, docs]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          target: runtime
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.pull_request.head_commit.timestamp || 'unknown' }}
          tags: supabackup:ci
      - name: "Image smoke: non-root, healthz, takeover, healthcheck, assets, SIGTERM"
        run: |
          set -euo pipefail
          docker run -d --name sb-ci -p 18080:8080 supabackup:ci
          cleanup() { docker rm -f sb-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          test "$(docker exec sb-ci id -u)" = "10001"
          # The container may still be migrating/starting when `docker run -d`
          # returns: wait for HTTP readiness BEFORE any functional assertion
          # (review round 6, R6-P1-01).
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:18080/api/healthz 2>/dev/null | grep -q '"status":"ok"' && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/api/healthz | grep -q '"status":"ok"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/api/auth/bootstrap -H 'Content-Type: application/json' -d '{"token":"x","username":"nope","password":"nope-pass-123"}')
          test "$code" -ge 400
          docker exec sb-ci /app/supabackup bootstrap | grep -q "One-time bootstrap token"
          # The embedded SPA's hashed assets must actually be served, not just
          # an index referencing missing files (round-5 R5-P1-01).
          # JS may be served as text/javascript or application/javascript
          # (optionally with charset); CSS as text/css. A JSON MIME must NOT
          # pass (review round 7, R7-P1-02).
          for ASSETS_TYPE in 'js|text/javascript|application/javascript' 'css|text/css'; do
            EXT="${ASSETS_TYPE%%|*}"
            ASSET=$(curl -fsS http://127.0.0.1:18080/ | grep -oE '/assets/[^"]+\.'"$EXT" | head -1)
            [ -n "$ASSET" ]
            MIME=$(curl -fsS -o /dev/null -w '%{content_type}' "http://127.0.0.1:18080$ASSET")
            case "$MIME" in
              text/css*|application/javascript*|text/javascript*) ;; # allowed
              *) echo "unexpected MIME for $ASSET: $MIME" >&2; exit 1 ;;
            esac
            case "$EXT" in
              js) case "$MIME" in text/css*) echo "js asset served as css" >&2; exit 1 ;; esac ;;
              css) case "$MIME" in text/css*) ;; *) echo "css asset wrong MIME: $MIME" >&2; exit 1 ;; esac ;;
            esac
          done
          # Docker health becomes healthy on its own schedule: poll, never
          # race a fixed sleep (review round 5, R5-P1-01).
          for _ in $(seq 1 30); do
            st=$(docker inspect --format '{{.State.Health.Status}}' sb-ci)
            [ "$st" = "healthy" ] && break
            [ "$st" = "unhealthy" ] && { echo "container unhealthy"; exit 1; }
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' sb-ci)" = "healthy"
          docker stop -t 15 sb-ci >/dev/null
          test "$(docker inspect --format '{{.State.ExitCode}}' sb-ci)" = "0"
      # Direct container run instead of trivy-action: the action's
      # setup-trivy step downloads a release binary via install.sh and has
      # been failing silently at that download (two consecutive runs died
      # right after "found version 0.65.0"). This job already has docker,
      # and the container invocation is exactly what the recorded
      # pre-release scans use (docs/release-scan-evidence.md).
      - name: trivy image scan (CRITICAL/HIGH, unfixed ignored)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            "aquasec/trivy:${TRIVY_VERSION}" image \
            --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
            --exit-code 1 --skip-version-check supabackup:ci
      - name: "Workflow file is valid YAML with valid Bash"
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "import yaml,sys; yaml.safe_load(open('.github/workflows/ci.yml'))"
          python3 - <<'PYEOF'
          import yaml, subprocess, sys, tempfile, os
          wf = yaml.safe_load(open('.github/workflows/ci.yml'))
          failed = False
          for jobname, job in wf.get('jobs', {}).items():
              for i, step in enumerate(job.get('steps', [])):
                  run = step.get('run')
                  if not run or step.get('uses'):
                      continue
                  with tempfile.NamedTemporaryFile('w', suffix='.sh', delete=False) as f:
                      f.write(run)
                      path = f.name
                  r = subprocess.run(['bash', '-n', path], capture_output=True, text=True)
                  os.unlink(path)
                  if r.returncode != 0:
                      print(f'bash -n failed for {jobname} step {i}:', r.stderr)
                      failed = True
          sys.exit(1 if failed else 0)
          PYEOF

  # Standalone-binary distribution (docs/deployment.md 二进制发行版): on v*
  # tags only, after the full gate (image waits on every other job), build
  # the cross-compile matrix via `make release`, smoke the artifacts the same
  # way the container is smoked, and attach them to a DRAFT GitHub release —
  # a human runs the pre-release scans (docs/release-scan-evidence.md) and
  # publishes.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image]
    # Job-scoped exception to the workflow-wide read-only default: creating
    # the draft release is the only repository write in CI.
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build release archives (frontend + cross-compile matrix)
        run: make release VERSION="${GITHUB_REF_NAME}"
      - name: "Smoke the artifacts: checksums, version stamp, serve, healthz, clean SIGTERM"
        run: |
          set -euo pipefail
          dist=dist/release
          test -s "$dist/SHA256SUMS"
          ( cd "$dist" && sha256sum -c SHA256SUMS )
          # The runner is linux/amd64: exercise that build as a bare process,
          # with PATH pointed at an EMPTY directory — pg_dump is genuinely
          # absent and the control plane must still boot (the client is only
          # needed when a backup actually runs).
          name="supabackup_${GITHUB_REF_NAME#v}_linux_amd64"
          bin="$dist/$name/supabackup"
          "$bin" version | grep -F "supabackup ${GITHUB_REF_NAME}"
          data=$(mktemp -d)
          emptybin=$(mktemp -d)
          env -i PATH="$emptybin" HOME="$data" SB_DATA_DIR="$data" \
            SB_ADDR=127.0.0.1:18081 "$bin" serve &
          pid=$!
          cleanup() { kill -TERM "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          # Boot may still be migrating: poll for readiness before asserting.
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:18081/api/healthz 2>/dev/null | grep -q '"status":"ok"' && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18081/api/healthz | grep -q '"status":"ok"'
          kill -TERM "$pid"
          wait "$pid" && rc=0 || rc=$?
          test "$rc" -eq 0 || { echo "serve exited $rc after SIGTERM" >&2; exit 1; }
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/release/supabackup_*.tar.gz dist/release/SHA256SUMS \
            --draft --verify-tag \
            --title "supabackup ${GITHUB_REF_NAME}" \
            --notes "独立二进制发行：linux/amd64、linux/arm64、darwin/amd64、darwin/arm64（tar.gz + SHA256SUMS）。
          安装与 pg_dump 前提：docs/deployment.md「二进制发行版」；归档内 README.md 同述。
          这是草稿：按 docs/release-scan-evidence.md 完成发布前扫描后手动 publish。"

  # Container distribution: publish the release image to GHCR on v* tags.
  # Each architecture builds NATIVELY — public repos get free arm64 hosted
  # runners, and emulating the PGDG apt install of the whole client matrix
  # under QEMU would be slow and flaky. Each leg pushes an anonymous digest;
  # `image-tags` below merges them into the versioned tags, and waits for the
  # `release` job so binaries and image never diverge in success state.
  publish-image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write  # push image manifests to GHCR
      contents: read
    outputs:
      # Matrix legs write disjoint keys; GitHub merges them into one map.
      digest_amd64: ${{ steps.digest.outputs.amd64 }}
      digest_arm64: ${{ steps.digest.outputs.arm64 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || 'unknown' }}
          # OCI labels link the GHCR package back to this repository.
          labels: |
            org.opencontainers.image.title=supabackup
            org.opencontainers.image.description=SupaCove: platform-independent logical backups (Supabase/Neon/Railway) into your own S3-compatible storage
            org.opencontainers.image.url=https://github.com/web-casa/supacove
            org.opencontainers.image.source=https://github.com/web-casa/supacove
            org.opencontainers.image.licenses=AGPL-3.0
          outputs: type=image,name=ghcr.io/web-casa/supabackup,push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        id: digest
        run: 'echo "${{ matrix.arch }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"'

  # Merge the per-architecture digests into the public tag set: X.Y.Z (the
  # tag with the leading v stripped) and `latest`. Runs only when BOTH the
  # binary release draft and both image legs succeeded.
  image-tags:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-image, release]
    permissions:
      packages: write  # tag the merged manifest list
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge digests into versioned tags
        run: |
          set -euo pipefail
          image=ghcr.io/web-casa/supabackup
          ver="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            -t "$image:$ver" \
            -t "$image:latest" \
            "$image@${{ needs.publish-image.outputs.digest_amd64 }}" \
            "$image@${{ needs.publish-image.outputs.digest_arm64 }}"
          docker buildx imagetools inspect "$image:$ver"
