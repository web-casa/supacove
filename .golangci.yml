# High-signal subset for a security-critical single-binary Go service:
# correctness, error handling, resource lifecycles, cancellation, and the
# few security patterns that static analysis reliably catches. Style and
# naming linters stay off on purpose (quality plan: signal over volume).
version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errcheck
    - errorlint
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - gosec
    - exhaustive
    - nolintlint
    # noctx/contextcheck are deliberately OFF (documented): database
    # operations intentionally use the context-free pool handle so shutdown
    # convergence can always write (round-2 P1-03). Outbound HTTP is bounded
    # per client instead: webhook/heartbeat clients carry an explicit Timeout
    # plus the netguard dial boundary; the storage SDK client relies on the
    # job-level execution budget (SB_JOB_TIMEOUT) and per-resume deadlines
    # rather than a client Timeout — enabling noctx would demand ~200
    # changes that contradict this design without adding a real boundary.
  settings:
    errcheck:
      check-type-assertions: true
      # The codebase convention is an EXPLICIT `_ =` for documented
      # best-effort calls (Close on cleanup paths, RowsAffected on
      # arbitration probes); check-blank would drown real misses in 300+
      # intentional sites. Genuinely unchecked calls stay flagged.
      check-blank: false
      exclude-functions:
        # Best-effort cleanup and output writes: the error cannot change the
        # outcome and every call site is a close/defer/write on a path that
        # already reports its own failure (documented at the sites). Store
        # Close is logged where the outcome matters (graceful shutdown).
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (*database/sql.Tx).Rollback
        - (*os.File).Close
        - (io.ReadCloser).Close
        - (*github.com/cloudfan/supabackup/backend/internal/db.Store).Close
        # os.RemoveAll here is only the throwaway temp-dir teardown in the
        # verifier; os.Remove cleanup sites are explicitly `_ =` annotated
        # where the outcome truly cannot change the result.
        - os.RemoveAll
        # FUNCTION-LEVEL exclusion: it also covers persistent file writes.
        # Audited current hits are all HTTP/pipe writers (metrics, static
        # handler) whose failure is unrecoverable mid-response; new
        # persistent-file Fprintf call sites must not be added under this
        # exemption — write with os.WriteFile and check the error.
        - fmt.Fprintf
        # fmt.Sscanf sites parse job IDs out of filenames that the
        # ^backup-job(\d+)\.dump\.age$ regexp already accepted. The count
        # return is ignored deliberately: its only failure mode is int64
        # overflow on a >19-digit name, which yields jobID 0 — never issued
        # (SQLite autoincrement starts at 1) — so the row is reported as an
        # unreferenced artifact instead of matching a real job. The regexp
        # does NOT bound the value; this is the real trade-off. Production parse failures surface
        # through the regexp, not the scan.
        - fmt.Sscanf
      # Deliberate fire-and-forget patterns are annotated at the call site;
      # a blanket exclusion would hide real leaks.
    gosec:
      # G104 duplicates errcheck (governed by exclude-functions above).
      # G304/G703: every flagged path derives from operator-controlled
      # SB_DATA_DIR/SB_SECRET_FILE/staging; the trust boundary is the
      # data-dir owner, symlink/permission hardening lives in config.Load,
      # and download reads go through os.Root (openUnderStaging).
      # G124: the four hits are deliberate — the SB_INSECURE_COOKIE dev
      # escape and the double-submit CSRF cookie whose HttpOnly=false IS
      # the mechanism; production session cookies carry
      # Secure/HttpOnly/SameSite=Strict, pinned by
      # TestProductionCookieAttributes.
      excludes:
        - G104
        - G304
        - G703
        - G124
        # G204: subprocess execution is the product (pg_dump/pg_restore);
        # each call site uses a fixed binary path, constructed argv,
        # PGPASSFILE credentials and a cancel-kill chain.
        - G204

    exhaustive:
      # Only switch statements over our own enums; default-case switches are
      # checked where the enum is closed (see default-signifies-exhaustive).
      default-signifies-exhaustive: true
    nolintlint:
      require-specific: true
      require-explanation: true
      allow-unused: false
  exclusions:
    generated: strict
    warn-unused: true
    rules:
      # Permission literals in TESTS create throwaway fixtures; production
      # permission choices are deliberate (0600/0700) and currently produce
      # zero G301/G302/G306 hits.
      - path: _test\.go
        linters: [gosec]
        text: "G30[126]"
      # The single G702 hit is db/db_test.go self-executing the test binary
      # via exec.Command(os.Args[0], "-test.run=…") — a fixture whose argv
      # the test itself controls; no production code is exempt.
      - path: _test\.go
        linters: [gosec]
        text: "G702"

      # Generated strict-server glue: errors are wrapped by the framework.
      - path: backend/internal/api/
        linters: [errcheck, errorlint]

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
