# Development environment: supabackup + a throwaway PostgreSQL target + MinIO (S3).
# Usage: make dev   → app on http://localhost:8080
#
# All published ports are bound to the loopback interface only: this compose
# file uses plain-HTTP dev cookies and shared fixed credentials, so it must
# never be reachable from other hosts (review P1-16). Remote access goes
# through an SSH tunnel or your own TLS reverse proxy.
services:
  app:
    build:
      context: .
      target: runtime
      args:
        VERSION: dev
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Plain HTTP locally: session cookies drop the Secure attribute.
      SB_INSECURE_COOKIE: "1"
      SB_LOG_LEVEL: debug
    volumes:
      - app-data:/app/data
    depends_on:
      - postgres
      - minio

  # Throwaway target database for backup experiments (NOT supabackup's own store).
  # PG18 images keep the cluster under PGDATA=/var/lib/postgresql/18/docker, so
  # the tmpfs must cover /var/lib/postgresql, not .../data (review P1-17).
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: appdb
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql

  # S3-compatible target for Phase 3 storage work.
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: supabackup
      MINIO_ROOT_PASSWORD: devpassword123
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    tmpfs:
      - /data

volumes:
  app-data:
